# =============================================================================
# GRADE THRESHOLDS
# =============================================================================

grades:
  "A+":  { min: 95, description: "Best-in-class across all metrics" }
  "A":   { min: 90, description: "Excellent — competitive with leader" }
  "A-":  { min: 85, description: "Very good — minor gaps" }
  "B+":  { min: 80, description: "Good — small optimization opportunities" }
  "B":   { min: 70, description: "Above average — known gaps with clear fix paths" }
  "C+":  { min: 60, description: "Fair — meaningful gaps in key metrics" }
  "C":   { min: 50, description: "Below average — significant optimization needed" }
  "D":   { min: 40, description: "Poor — major gaps in multiple metrics" }
  "D-":  { min: 30, description: "Very poor — fundamental architecture limitations" }
  "F":   { min: 0,  description: "Critical — broken or unusable" }

# =============================================================================
# SCORE COMPUTATION REFERENCE
# =============================================================================
#
# To compute scores from probador JSON output:
#
#   1. Run isolated benchmarks:
#      probador llm load --url <url> --duration 60 --concurrency 1 \
#        --warmup 5 --stream true --prompt-profile short --max-tokens 32
#
#   2. Collect metrics from JSON: decode_tok_s, ttft_p50_ms, itl_p50_ms,
#      prefill_tok_s, ttft_p999_ms, error_rate
#
#   3. For each metric, find best value across all runtimes
#
#   4. Score = (value / best) * 100 for higher-is-better
#      Score = (best / value) * 100 for lower-is-better
#
#   5. Composite = weighted sum using weights above
#
#   6. Assign grade from thresholds
#
# Implementation: scripts/compute-scores.py (TODO)
# Integration: make report should emit scores alongside benchmark tables

# =============================================================================
# GRADE THRESHOLDS
# =============================================================================

grades:
  "A+":  { min: 95, description: "Best-in-class across all metrics" }
  "A":   { min: 90, description: "Excellent — competitive with leader" }
  "A-":  { min: 85, description: "Very good — minor gaps" }
  "B+":  { min: 80, description: "Good — small optimization opportunities" }
  "B":   { min: 70, description: "Above average — known gaps with clear fix paths" }
  "C+":  { min: 60, description: "Fair — meaningful gaps in key metrics" }
  "C":   { min: 50, description: "Below average — significant optimization needed" }
  "D":   { min: 40, description: "Poor — major gaps in multiple metrics" }
  "D-":  { min: 30, description: "Very poor — fundamental architecture limitations" }
  "F":   { min: 0,  description: "Critical — broken or unusable" }

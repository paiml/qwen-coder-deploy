# Inference Runtime Scoring Contract v1.0.0
#
# Quantitative grading system for comparing inference runtimes:
#   realizr (apr-cli), llama.cpp, ollama, vLLM
#
# Scores are computed from probador benchmark JSON output.
# Each runtime gets a 0-100 composite score per platform per concurrency level.
#
# Design principles:
#   - Best runtime on each metric scores 100 (relative scoring, not absolute)
#   - Weighted composite captures multi-dimensional tradeoffs
#   - Platform-specific: RTX 4060L and Jetson Orin have different profiles
#   - Concurrency-specific: c=1 (interactive) and c=4 (throughput) scored separately
#   - Machine-readable: probador JSON → score computation → report

metadata:
  version: "1.0.0"
  created: "2026-03-11"
  author: "PAIML Engineering"
  model: "Qwen2.5-Coder-1.5B-Instruct (Q4_K_M, 1.5B params, 28 layers)"
  tool: "probador llm load --stream true --prompt-profile short --max-tokens 32"
  methodology: "60s duration, 5s warmup, isolated (one runtime at a time), locked GPU clocks"

# =============================================================================
# SCORING METHODOLOGY
# =============================================================================
#
# For each metric, compute a per-runtime score:
#
#   Higher-is-better (decode_tok_s, prefill_tok_s, throughput_scaling):
#     score_i = (value_i / max(all_values)) * 100
#
#   Lower-is-better (ttft_p50, itl_p50, ttft_p999, error_rate):
#     score_i = (min(all_values) / value_i) * 100
#     (if value_i == 0 for error_rate, score = 100)
#
#   Composite score = Σ(weight_k * score_k) for all metrics k
#
# Interpretation:
#   90-100: Excellent — competitive with best-in-class
#   70-89:  Good — minor gaps in some areas
#   50-69:  Fair — meaningful gaps, optimization opportunities
#   30-49:  Poor — significant performance issues
#   0-29:   Critical — major regressions or broken functionality

# =============================================================================
# METRIC WEIGHTS
# =============================================================================

weights:
  # c=1 (interactive): prioritizes responsiveness and per-request quality
  interactive:
    decode_tok_s:       0.25  # Core generation speed (user-perceived typing speed)
    ttft_p50_ms:        0.25  # Time to first token (user-perceived responsiveness)
    itl_p50_ms:         0.15  # Inter-token latency consistency (smoothness)
    prefill_tok_s:      0.10  # Prefill throughput (context processing speed)
    ttft_p999_ms:       0.15  # Tail latency (worst-case responsiveness)
    error_rate:         0.10  # Reliability

  # c=4 (throughput): prioritizes aggregate capacity and scaling
  throughput:
    aggregate_tok_s:    0.30  # Total system throughput
    decode_tok_s:       0.15  # Per-slot decode speed under load
    ttft_p50_ms:        0.15  # Responsiveness under contention
    itl_p50_ms:         0.15  # Streaming smoothness under load
    throughput_scaling:  0.15  # c=4/c=1 aggregate ratio (batching efficiency)
    error_rate:         0.10  # Reliability under load


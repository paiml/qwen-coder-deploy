# Inference Runtime Scoring Contract v2.0.0
#
# Quantitative grading system for comparing inference runtimes:
#   realizr (apr-cli), llama.cpp, ollama, vLLM
#
# v2.0.0 changes from v1.0.0 (falsification-driven):
#   - BREAKING: Switched from relative scoring (best=100) to absolute thresholds
#     Rationale (F-1): Relative scoring is fragile — adding/removing a runtime
#     changes ALL scores. Absolute thresholds define "what is good" independently.
#   - BREAKING: Removed prefill_tok_s from weighted score (F-3 redundancy with TTFT)
#   - Added jitter penalty on ITL score from tail_analysis (F-4, Metron critique)
#   - Added best-in-class bonus (+5, capped) to preserve competitive ranking
#   - Increased decode + TTFT weights to 0.30 each (from 0.25)
#   - Implementation: probador llm score (see probador-llm-score-v1.yaml)
#
# Design informed by:
#   MLPerf Inference (per-scenario, no composite — we diverge deliberately)
#   Metron fluidity-index (arXiv 2407.07000) — jitter penalty
#   Smooth Goodput (arXiv 2410.14257) — partial credit for SLO violations
#   NVIDIA GenAI-Perf — ITL excludes TTFT, sliding window stability
#   pmat perfection-score — weighted category aggregation pattern

metadata:
  version: "2.0.0"
  created: "2026-03-11"
  author: "PAIML Engineering"
  model: "Qwen2.5-Coder-1.5B-Instruct (Q4_K_M, 1.5B params, 28 layers)"
  tool: "probador llm score"
  data_source: "probador llm load --stream true --prompt-profile short --max-tokens 32"
  methodology: "60s duration, 5s warmup, isolated (one runtime at a time), locked GPU clocks"
  spec: "contracts/probador-llm-score-v1.yaml"

# =============================================================================
# SCORING METHODOLOGY — Absolute Thresholds with Best-in-Class Bonus
# =============================================================================
#
# For each metric, compute score from absolute thresholds:
#
#   Higher-is-better (decode_tok_s, aggregate_tok_s, throughput_scaling):
#     value >= excellent → 100
#     value >= good      → 75 + 25*(value-good)/(excellent-good)
#     value < good       → 75*value/good
#
#   Lower-is-better (ttft_p50, itl_p50, ttft_p99, error_rate):
#     value <= excellent → 100
#     value <= good      → 75 + 25*(good-value)/(good-excellent)
#     value > good       → max(0, 75*good/value)
#
#   Best-in-class bonus: +5 per metric where runtime is best (capped at 100)
#   Jitter penalty: up to -30 on ITL score based on tail_analysis
#
#   Composite = Σ(weight_k * adjusted_score_k)

# =============================================================================
# ABSOLUTE THRESHOLDS
# =============================================================================
#
# "excellent" = score 100 (what we consider best-in-class performance)
# "good" = score 75 (solid, no complaints)
# Derived from current yoga RTX 4060L baselines (PMAT-086).

thresholds:
  decode_tok_s:    { excellent: 160, good: 120, direction: "higher_is_better" }
  ttft_p50_ms:     { excellent: 12,  good: 50,  direction: "lower_is_better" }
  itl_p50_ms:      { excellent: 6.0, good: 10,  direction: "lower_is_better" }
  ttft_p99_ms:     { excellent: 15,  good: 50,  direction: "lower_is_better" }
  error_rate:      { excellent: 0.0, good: 0.01, direction: "lower_is_better" }
  aggregate_tok_s: { excellent: 600, good: 300, direction: "higher_is_better" }
  throughput_scaling: { excellent: 3.8, good: 2.0, direction: "higher_is_better" }

# =============================================================================
# METRIC WEIGHTS
# =============================================================================

weights:
  interactive:  # c=1
    decode_tok_s:   0.30  # Core generation speed
    ttft_p50_ms:    0.30  # Responsiveness (primary UX metric)
    itl_p50_ms:     0.15  # Streaming smoothness (with jitter penalty)
    ttft_p99_ms:    0.15  # Tail latency (worst-case)
    error_rate:     0.10  # Reliability
    # Total: 1.00
    # Note: prefill_tok_s removed (redundant with TTFT — see F-3)

  throughput:  # c=4+
    aggregate_tok_s:    0.30  # Total system throughput
    decode_tok_s:       0.15  # Per-slot decode under load
    ttft_p50_ms:        0.15  # Responsiveness under contention
    itl_p50_ms:         0.15  # Smoothness under load
    throughput_scaling:  0.15  # Batching efficiency (c=N/c=1)
    error_rate:         0.10  # Reliability under load
    # Total: 1.00

# =============================================================================
# CURRENT SCORES — RTX 4060 Laptop (yoga, PMAT-086, 2026-03-11)
# =============================================================================
# Recomputed with v2.0.0 absolute thresholds.


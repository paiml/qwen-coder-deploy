# Inference Runtime Scoring Contract v3.0.0
#
# Quantitative grading system for comparing inference runtimes:
#   realizr (apr-cli), llama.cpp, ollama, vLLM
#
# v2.0.0 changes from v1.0.0 (falsification-driven):
#   - BREAKING: Switched from relative scoring (best=100) to absolute thresholds
#     Rationale (F-1): Relative scoring is fragile — adding/removing a runtime
#     changes ALL scores. Absolute thresholds define "what is good" independently.
#   - BREAKING: Removed prefill_tok_s from weighted score (F-3 redundancy with TTFT)
#   - Added jitter penalty on ITL score from tail_analysis (F-4, Metron critique)
#   - Added best-in-class bonus (+5, capped) to preserve competitive ranking
#   - Increased decode + TTFT weights to 0.30 each (from 0.25)
#   - Implementation: probador llm score (see probador-llm-score-v1.yaml)
#
# Design informed by:
#   MLPerf Inference (per-scenario, no composite — we diverge deliberately)
#   Metron fluidity-index (arXiv 2407.07000) — jitter penalty
#   Smooth Goodput (arXiv 2410.14257) — partial credit for SLO violations
#   NVIDIA GenAI-Perf — ITL excludes TTFT, sliding window stability
#   pmat perfection-score — weighted category aggregation pattern

metadata:
  version: "3.0.0"
  created: "2026-03-11"
  author: "PAIML Engineering"
  model: "Qwen2.5-Coder-1.5B-Instruct (Q4_K_M, 1.5B params, 28 layers)"
  tool: "probador llm score"
  data_source: "probador llm load --stream true --prompt-profile short --max-tokens 32"
  methodology: "60s duration, 5s warmup, isolated (one runtime at a time), locked GPU clocks"
  spec: "docs/specifications/probador-llm-score-v1.yaml"

# =============================================================================
# SCORING METHODOLOGY — Absolute Thresholds with Best-in-Class Bonus
# =============================================================================
#
# For each metric, compute score from absolute thresholds:
#
#   Higher-is-better (decode_tok_s, aggregate_tok_s, throughput_scaling):
#     value >= excellent → 100
#     value >= good      → 75 + 25*(value-good)/(excellent-good)
#     value < good       → 75*value/good
#
#   Lower-is-better (ttft_p50, itl_p50, ttft_p99, error_rate):
#     value <= excellent → 100
#     value <= good      → 75 + 25*(good-value)/(good-excellent)
#     value > good       → max(0, 75*good/value)
#
#   Best-in-class bonus: +5 per metric where runtime is best (capped at 100)
#   Jitter penalty: up to -30 on ITL score based on tail_analysis
#
#   Composite = Σ(weight_k * adjusted_score_k)

# =============================================================================
# ABSOLUTE THRESHOLDS
# =============================================================================
#
# "excellent" = score 100 (what we consider best-in-class performance)
# "good" = score 75 (solid, no complaints)
# Derived from current yoga RTX 4060L baselines (PMAT-086).

thresholds:
  decode_tok_s:    { excellent: 160, good: 120, direction: "higher_is_better" }
  ttft_p50_ms:     { excellent: 12,  good: 50,  direction: "lower_is_better" }
  itl_p50_ms:      { excellent: 6.0, good: 10,  direction: "lower_is_better" }
  ttft_p99_ms:     { excellent: 15,  good: 50,  direction: "lower_is_better" }
  error_rate:      { excellent: 0.0, good: 0.01, direction: "lower_is_better" }
  aggregate_tok_s: { excellent: 600, good: 300, direction: "higher_is_better" }
  throughput_scaling: { excellent: 3.8, good: 2.0, direction: "higher_is_better" }

# =============================================================================
# METRIC WEIGHTS
# =============================================================================

weights:
  interactive:  # c=1
    decode_tok_s:   0.30  # Core generation speed
    ttft_p50_ms:    0.30  # Responsiveness (primary UX metric)
    itl_p50_ms:     0.15  # Streaming smoothness (with jitter penalty)
    ttft_p99_ms:    0.15  # Tail latency (worst-case)
    error_rate:     0.10  # Reliability
    # Total: 1.00
    # Note: prefill_tok_s removed (redundant with TTFT — see F-3)

  throughput:  # c=4+
    aggregate_tok_s:    0.30  # Total system throughput
    decode_tok_s:       0.15  # Per-slot decode under load
    ttft_p50_ms:        0.15  # Responsiveness under contention
    itl_p50_ms:         0.15  # Smoothness under load
    throughput_scaling:  0.15  # Batching efficiency (c=N/c=1)
    error_rate:         0.10  # Reliability under load
    # Total: 1.00

# =============================================================================
# CURRENT SCORES — RTX 4060 Laptop (yoga, PMAT-086, 2026-03-11)
# =============================================================================
# Recomputed with v2.0.0 absolute thresholds.

scores:
  yoga_rtx4060l:
    date: "2026-03-12"
    gpu: "RTX 4060 Laptop (24 SMs, sm_89, 8GB VRAM)"
    clock: "locked 1900MHz"

    interactive:  # c=1, short prompt (23 tokens), stream=true, 60s
      raw_data:
        vllm:
          decode_tok_s: 168.3
          ttft_p50_ms: 11.4
          itl_p50_ms: 5.9
          ttft_p99_ms: 14.0
          error_rate: 0.0
        llamacpp:
          decode_tok_s: 160.7
          ttft_p50_ms: 10.1
          itl_p50_ms: 6.2
          ttft_p99_ms: 13.3
          error_rate: 0.0
        ollama:
          decode_tok_s: 163.5
          ttft_p50_ms: 70.5
          itl_p50_ms: 6.1
          ttft_p99_ms: 72.0
          error_rate: 0.0
        realizr:
          decode_tok_s: 154.8
          ttft_p50_ms: 13.4
          itl_p50_ms: 6.5
          ttft_p99_ms: 34.5
          error_rate: 0.0

      # v2.0.0 absolute scores (threshold-based)
      #
      # decode:  vLLM=100, ollama=91, llamacpp=90, realizr=87 (excellent=160)
      # ttft:    llamacpp=100, vLLM=97, realizr=94, ollama=13 (excellent=12ms)
      # itl:     vLLM=97, llamacpp=88, ollama=88, realizr=82 (excellent=6ms)
      # ttftp99: llamacpp=100, vLLM=100, realizr=61, ollama=16 (excellent=15ms)
      # error:   all=100 except llamacpp=83 (0.7%, threshold good=1%)
      #
      # Best-in-class bonus (★): vLLM=decode+itl, llamacpp=ttft+tail, realizr=none, ollama=none
      composite:
        vllm:      { score: 97.1, grade: "A+" }
        llamacpp:  { score: 93.8, grade: "A" }
        realizr:   { score: 82.2, grade: "B+" }
        ollama:    { score: 54.4, grade: "C" }

    throughput:  # c=4, short prompt, stream=true, 60s
      raw_data:
        vllm:
          aggregate_tok_s: 598.0
          decode_tok_s: 162.3
          ttft_p50_ms: 23.4
          itl_p50_ms: 6.2
          error_rate: 0.0
          throughput_scaling: 3.55  # 598.0/168.3
        llamacpp:
          aggregate_tok_s: 338.6
          decode_tok_s: 86.0
          ttft_p50_ms: 17.3
          itl_p50_ms: 11.6
          error_rate: 0.0
          throughput_scaling: 2.11  # 338.6/160.7
        realizr:
          aggregate_tok_s: 210.8
          decode_tok_s: 72.4
          ttft_p50_ms: 41.0
          itl_p50_ms: 13.8
          error_rate: 0.0
          throughput_scaling: 1.36  # 210.8/154.8
        ollama:
          aggregate_tok_s: 158.0
          decode_tok_s: 160.6
          ttft_p50_ms: 616.0
          itl_p50_ms: 6.2
          error_rate: 0.0
          throughput_scaling: 0.97  # 158.0/163.5
      composite:
        vllm:      { score: 98.2, grade: "A+" }
        llamacpp:  { score: 67.1, grade: "C+" }
        realizr:   { score: 44.8, grade: "D" }
        ollama:    { score: 32.0, grade: "D-" }

# =============================================================================
# PER-LAYER DECODE EFFICIENCY (--by-layer)
# =============================================================================
#
# Scores decode speed normalized per transformer layer (us/layer).
# Uses decode_us_per_layer from LoadTestResult (requires --num-layers 28).
#
# Thresholds (absolute, for Q4_K_M on RTX 4060L-class hardware):
#   excellent: 220 us/layer → score 100
#   good:      300 us/layer → score 75
#
# Rationale: at 28 layers, 220us/layer = 6.16ms/token = 162 tok/s
#            at 28 layers, 300us/layer = 8.40ms/token = 119 tok/s
#
# This dimension isolates compute efficiency from model size, enabling
# cross-model comparison (e.g., 7B model at 28 layers vs 1.5B at 28 layers).

layer_scoring:
  metric: decode_us_per_layer
  thresholds:
    excellent: 220  # us/layer
    good: 300       # us/layer
  direction: lower_is_better

# =============================================================================
# PER-PROMPT-PROFILE SCORING (--by-profile)
# =============================================================================
#
# Classifies requests by prompt token count into categories, then computes
# per-category decode/TTFT/ITL metrics and composite scores.
#
# Categories (by avg prompt tokens per request):
#   Micro:  < 15 tokens  (system prompt only, chat-style)
#   Short:  < 64 tokens  (typical instruction)
#   Medium: < 256 tokens (code context, RAG chunks)
#   Long:   >= 256 tokens (full documents, long context)
#
# Consistency score: worst_score / best_score across all populated categories.
#   1.0  = perfectly consistent (same quality at all prompt lengths)
#   <0.5 = severe degradation for some prompt lengths
#
# Thresholds reuse the top-level metric thresholds. Composite weight profile
# matches the interactive weights (decode 30%, TTFT 30%, ITL 15%, tail 15%, error 10%).

profile_scoring:
  categories:
    micro:  { max_tokens: 15 }
    short:  { max_tokens: 64 }
    medium: { max_tokens: 256 }
    long:   { max_tokens: null }  # >= 256
  consistency:
    target: 0.90   # goal: <10% degradation across profiles
    warning: 0.70  # >30% degradation flags concern

# =============================================================================
# CORRECTNESS SCORING (--by-correctness)
# =============================================================================
#
# Scores assertion pass rate from inline quality validation during load tests.
# Requires --validate basic|contains:X|pattern:X during probador llm load.
#
# Thresholds:
#   excellent: 100% pass rate → score 100
#   good: 95% pass rate → score 75
#   Below 95%: linear degradation. At 80% → ~63. At 50% → ~37.

correctness_scoring:
  metric: pass_rate
  thresholds:
    excellent: 1.0
    good: 0.95
  direction: higher_is_better

# =============================================================================
# OUTPUT LENGTH PROFILE SCORING (--by-output-length)
# =============================================================================
#
# Classifies responses by output (completion) token count into buckets:
#   Short: < 32 tokens
#   Medium: 32-128 tokens
#   Long: > 128 tokens
#
# Scores per-bucket ITL using the main ITL threshold (excellent=6ms, good=10ms).
# Reveals KV cache scaling: longer outputs → more attention compute → higher ITL.
# Requires request_details (populated with --stream).

output_length_scoring:
  categories:
    short:  { max_tokens: 32 }
    medium: { max_tokens: 128 }
    long:   { max_tokens: null }
  metric: itl_p50_ms  # scored per bucket

# =============================================================================
# MEMORY EFFICIENCY SCORING (--by-memory)
# =============================================================================
#
# Scores decode throughput normalized by VRAM usage: tok/s per GB.
# Requires --gpu-telemetry during load test.
#
# Thresholds:
#   excellent: 40 tok/s/GB (~140 tok/s in 3.5 GB GGUF)
#   good: 20 tok/s/GB (~160 tok/s in 8 GB)

memory_scoring:
  metric: tok_per_sec_per_gb
  thresholds:
    excellent: 40.0
    good: 20.0
  direction: higher_is_better

# =============================================================================
# COLD START SCORING (--by-cold-start)
# =============================================================================
#
# Scores time from process launch to first successful health check.
# Requires cold_start_ms in LoadTestResult (populated by probador llm bench
# with --start-command).
#
# Thresholds:
#   excellent: 500ms (Rust binary + GGUF load)
#   good: 3000ms (acceptable for autoscaling)
#
# Expected ranges: realizr ~200-500ms, llama.cpp ~500-1000ms,
#   ollama ~1-3s, vLLM ~15-30s (Python + model + CUDA init)

cold_start_scoring:
  metric: cold_start_ms
  thresholds:
    excellent: 500
    good: 3000
  direction: lower_is_better

# =============================================================================
# POWER EFFICIENCY SCORING (--by-power)
# =============================================================================
#
# Scores decode throughput per watt: tok/s per W.
# Requires --gpu-telemetry during load test (nvidia-smi power_draw).
#
# Thresholds:
#   excellent: 3.0 tok/s/W (Jetson Orin class efficiency)
#   good: 1.5 tok/s/W (desktop GPU efficiency)

power_scoring:
  metric: tok_per_watt
  thresholds:
    excellent: 3.0
    good: 1.5
  direction: higher_is_better

# =============================================================================
# CONCURRENCY SCALING SCORING (--by-scaling)
# =============================================================================
#
# Scores how well a runtime scales with concurrent requests.
# Efficiency = peak_aggregate_tok_s / (c1_decode_tok_s × peak_concurrency).
# 1.0 = perfect linear scaling (each worker at full c=1 speed).
#
# Reconstructed from LoadTestResult files at different concurrency levels.
# Runtime names matched by stripping -cN suffix.
#
# Thresholds:
#   excellent: 90% (near-linear, vLLM PagedAttention class)
#   good: 50% (acceptable batching efficiency)
#
# Current yoga results (PMAT-086):
#   vLLM:      88.1% (A+) — continuous batching + PagedAttention
#   llama.cpp: 52.7% (B)  — server-level batching
#   realizr:   41.5% (C+) — model.write() serialization (GH-141)
#   ollama:    23.8% (D-) — no batching (serializes at HTTP level)

concurrency_scaling:
  metric: scaling_efficiency
  thresholds:
    excellent: 0.90
    good: 0.50
  direction: higher_is_better

# =============================================================================
# GRADE THRESHOLDS
# =============================================================================

grades:
  "A+":  { min: 95, description: "Best-in-class across all metrics" }
  "A":   { min: 90, description: "Excellent — competitive with leader" }
  "A-":  { min: 85, description: "Very good — minor gaps" }
  "B+":  { min: 80, description: "Good — small optimization opportunities" }
  "B":   { min: 70, description: "Above average — known gaps with clear fix paths" }
  "C+":  { min: 60, description: "Fair — meaningful gaps in key metrics" }
  "C":   { min: 50, description: "Below average — significant optimization needed" }
  "D":   { min: 40, description: "Poor — major gaps in multiple metrics" }
  "D-":  { min: 30, description: "Very poor — fundamental architecture limitations" }
  "F":   { min: 0,  description: "Critical — broken or unusable" }

  - 'AC3: nsys vLLM at c=16 — DONE (85.0% CUTLASS GEMM 2.20ms, FlashAttn 11.7%)'
  - 'AC4: Cross-concurrency GEMM time delta — DONE (+2.8% c=1→c=16)'

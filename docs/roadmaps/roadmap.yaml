  - kernel-profile
  - scaling
  - profiling
  - 4060L
  notes: |
    Root cause of vLLM 3x scaling advantage: SINGLE CUTLASS WMMA GEMM kernel
    is 95.7% of GPU time at c>=2. GEMM time +2.8% from c=1 to c=16 but
    processes M tokens per call — linear throughput scaling.
    At c=1: cuBLAS dispatches to GEMV (same 2.14ms). At c>=2: CUTLASS GEMM.
    FlashAttention grows 0.1%→11.7% (c=1→c=16) as KV cache grows.
    This is vLLM asymptote limiter at ~3050 tok/s.
    realizr: 771 kernels (84µs largest) behind CUDA graph. vLLM: ~113 kernels (2.14ms each).
    25x longer per-kernel work → launch overhead negligible.
    The scheduling gap IS the kernel architecture gap.

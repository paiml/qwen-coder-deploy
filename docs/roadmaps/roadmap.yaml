    Key finding: Q4K GEMV is UNDERUTILIZED on 4060L (23.5% compute, 21.1% DRAM)
    despite 86% occupancy. Same kernel is compute-bound on Jetson (72% compute).
    Root cause: kernel too fine-grained for 24 SMs (4.29µs duration).

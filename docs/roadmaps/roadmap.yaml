  notes: |
    CRITICAL BUG: realizr generates 0 tokens at c>=9 with long prompts (~353 tokens).
    Exact threshold: c=8 works perfectly (64/64/64/64), c=9 produces 0/0/0/0.
    Once triggered, server stays in degraded state until restart.
    Reproducible with both fixed:64 and uniform:16,256 output.
    vLLM c=16 long produces p50=140 tokens (normal). llama.cpp c=8 OK.
    PMAT-220 c=16 data (avg_tok=63) was from partially degraded state — INVALIDATED.
    Likely root cause: KV workspace or CUDA graph corruption at M>=9 with large KV.
    9 requests × 353 tokens = 3177 total KV positions may exceed some internal limit.
    This bug needs to be fixed in realizr (src/cuda/ or src/serving/).

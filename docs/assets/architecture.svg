<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="realizarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="llamaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="vllmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="wgpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="probarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="12" width="900" height="44" fill="url(#headerGrad)"/>
  <text x="450" y="36" text-anchor="middle" fill="white" font-size="18" font-weight="700">Qwen2.5-Coder — Five Runtime Benchmark</text>

  <!-- Model box -->
  <rect x="310" y="76" width="280" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Qwen2.5-Coder-1.5B-Instruct Q4_K_M</text>
  <text x="450" y="118" text-anchor="middle" fill="#64748b" font-size="11">Same model, same prompts, five engines</text>

  <!-- Arrows from model to runtimes -->
  <line x1="350" y1="128" x2="90" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="390" y1="128" x2="270" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="450" y1="128" x2="450" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="510" y1="128" x2="630" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="128" x2="810" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Runtime 1: realizar -->
  <rect x="20" y="168" width="150" height="100" rx="10" fill="url(#realizarGrad)" filter="url(#shadow)"/>
  <text x="95" y="196" text-anchor="middle" fill="white" font-size="14" font-weight="700">realizar</text>
  <text x="95" y="214" text-anchor="middle" fill="#e0d4fc" font-size="10">Rust + CUDA</text>
  <rect x="30" y="228" width="130" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="95" y="243" text-anchor="middle" fill="white" font-size="10" font-family="monospace">:8081 GGUF Q4K</text>

  <!-- Runtime 2: ollama -->
  <rect x="195" y="168" width="150" height="100" rx="10" fill="url(#ollamaGrad)" filter="url(#shadow)"/>
  <text x="270" y="196" text-anchor="middle" fill="white" font-size="14" font-weight="700">Ollama</text>
  <text x="270" y="214" text-anchor="middle" fill="#a7f3d0" font-size="10">Go Runtime</text>
  <rect x="205" y="228" width="130" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="270" y="243" text-anchor="middle" fill="white" font-size="10" font-family="monospace">:8082 GGUF Q4K</text>

  <!-- Runtime 3: llama.cpp -->
  <rect x="370" y="168" width="150" height="100" rx="10" fill="url(#llamaGrad)" filter="url(#shadow)"/>
  <text x="445" y="196" text-anchor="middle" fill="white" font-size="14" font-weight="700">llama.cpp</text>
  <text x="445" y="214" text-anchor="middle" fill="#fde68a" font-size="10">C++ Runtime</text>
  <rect x="380" y="228" width="130" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="445" y="243" text-anchor="middle" fill="white" font-size="10" font-family="monospace">:8083 GGUF Q4K</text>

  <!-- Runtime 4: vLLM -->
  <rect x="545" y="168" width="150" height="100" rx="10" fill="url(#vllmGrad)" filter="url(#shadow)"/>
  <text x="620" y="196" text-anchor="middle" fill="white" font-size="14" font-weight="700">vLLM</text>
  <text x="620" y="214" text-anchor="middle" fill="#fecaca" font-size="10">Python + CUTLASS</text>
  <rect x="555" y="228" width="130" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="620" y="243" text-anchor="middle" fill="white" font-size="10" font-family="monospace">:8084 AWQ INT4</text>

  <!-- Runtime 5: WGPU -->
  <rect x="720" y="168" width="150" height="100" rx="10" fill="url(#wgpuGrad)" filter="url(#shadow)"/>
  <text x="795" y="196" text-anchor="middle" fill="white" font-size="14" font-weight="700">WGPU</text>
  <text x="795" y="214" text-anchor="middle" fill="#a5f3fc" font-size="10">Rust + Vulkan</text>
  <rect x="730" y="228" width="130" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="795" y="243" text-anchor="middle" fill="white" font-size="10" font-family="monospace">:8081 AMD/Intel</text>

  <!-- Arrows from runtimes to probador -->
  <line x1="95" y1="268" x2="95" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="270" y1="268" x2="270" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="445" y1="268" x2="445" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="620" y1="268" x2="620" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="795" y1="268" x2="795" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="95,308 91,300 99,300" fill="#94a3b8"/>
  <polygon points="270,308 266,300 274,300" fill="#94a3b8"/>
  <polygon points="445,308 441,300 449,300" fill="#94a3b8"/>
  <polygon points="620,308 616,300 624,300" fill="#94a3b8"/>
  <polygon points="795,308 791,300 799,300" fill="#94a3b8"/>

  <!-- probador testing bar -->
  <rect x="20" y="308" width="860" height="80" rx="10" fill="url(#probarGrad)" filter="url(#shadow)"/>
  <text x="450" y="334" text-anchor="middle" fill="white" font-size="15" font-weight="700">probador llm</text>
  <text x="450" y="354" text-anchor="middle" fill="#bfdbfe" font-size="11">Correctness (6 prompts)  |  Load Testing (c=1 to c=128)  |  Quality Scoring</text>
  <text x="450" y="374" text-anchor="middle" fill="#93c5fd" font-size="10">All runtimes serve OpenAI-compatible /v1/chat/completions</text>

  <!-- Output boxes -->
  <rect x="80" y="418" width="200" height="56" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="442" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">results/*.json</text>
  <text x="180" y="458" text-anchor="middle" fill="#64748b" font-size="10">Throughput, latency, quality per runtime</text>

  <rect x="350" y="418" width="200" height="56" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="442" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">Scorecards</text>
  <text x="450" y="458" text-anchor="middle" fill="#64748b" font-size="10">A+ to F grades per runtime + concurrency</text>

  <rect x="620" y="418" width="200" height="56" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="442" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">performance.md</text>
  <text x="720" y="458" text-anchor="middle" fill="#64748b" font-size="10">Historical comparison tables</text>

  <!-- Arrows from probador to outputs -->
  <line x1="250" y1="388" x2="180" y2="418" stroke="#94a3b8" stroke-width="1"/>
  <line x1="450" y1="388" x2="450" y2="418" stroke="#94a3b8" stroke-width="1"/>
  <line x1="650" y1="388" x2="720" y2="418" stroke="#94a3b8" stroke-width="1"/>

  <!-- GPU label -->
  <rect x="20" y="150" width="60" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="163" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">NVIDIA</text>

  <rect x="720" y="150" width="60" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="163" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">AMD</text>
</svg>

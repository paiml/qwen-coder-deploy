version: "1.0"
name: qwen-coder-teardown
description: "Stop all Qwen inference services on intel"

machines:
  intel:
    hostname: intel
    addr: 192.168.50.100
    user: noah
    ssh_key: ~/.ssh/id_ed25519
    arch: x86_64
    transport: ssh

resources:
  stop-realizar:
    type: task
    machine: intel
    command: "pkill -f 'apr serve' 2>/dev/null || true; sleep 1"
    completion_check: "! pgrep -f 'apr serve' >/dev/null 2>&1"

  stop-ollama:
    type: task
    machine: intel
    command: "pkill -f 'ollama serve' 2>/dev/null || true; sleep 1"
    completion_check: "! pgrep -f 'ollama serve' >/dev/null 2>&1"

  stop-llamacpp:
    type: task
    machine: intel
    command: "pkill -f 'llama-server' 2>/dev/null || true; sleep 1"
    completion_check: "! pgrep -f 'llama-server' >/dev/null 2>&1"

policy:
  failure: continue_independent
  tripwire: false
  lock_file: false

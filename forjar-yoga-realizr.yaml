version: "1.0"
name: qwen-coder-deploy-yoga-realizr
description: "Isolated realizr benchmark on yoga (RTX 4060 Laptop)"

params:
  gguf_model: "/home/noah/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

machines:
  yoga:
    hostname: yoga
    addr: 192.168.50.38
    user: noah
    arch: x86_64
    transport: ssh

resources:
  stop-ollama:
    type: task
    machine: yoga
    command: "pkill -f 'ollama serve' 2>/dev/null || true; sudo systemctl stop ollama.service 2>/dev/null || true"
    completion_check: "! pgrep -f 'ollama serve' >/dev/null 2>&1"

  stop-llamacpp:
    type: task
    machine: yoga
    command: "pkill -f 'llama-server' 2>/dev/null || true"
    completion_check: "! pgrep -f 'llama-server' >/dev/null 2>&1"

  stop-apr:
    type: task
    machine: yoga
    command: "pkill -f 'apr serve' 2>/dev/null || true; sleep 2; pkill -9 -f 'apr serve' 2>/dev/null || true; sleep 1; true"
    completion_check: "! pgrep -f 'apr serve' >/dev/null 2>&1"

  # Provable contract: benchmark ports open for LAN access
  ufw-bench-ports:
    type: task
    machine: yoga
    command: "sudo ufw status | grep -q '8081:8084' || sudo ufw allow from 192.168.50.0/24 to any port 8081:8084 proto tcp"
    completion_check: "sudo ufw status | grep -q '8081:8084'"

  lock-clocks:
    type: task
    machine: yoga
    command: "sudo nvidia-smi -lgc 1900,1900 2>/dev/null || true"
    completion_check: "nvidia-smi --query-gpu=clocks.current.graphics --format=csv,noheader 2>/dev/null | grep -q '[0-9]'"
    depends_on: [stop-ollama, stop-llamacpp, stop-apr, ufw-bench-ports]

  apr-gguf-gpu:
    type: task
    machine: yoga
    command: "SKIP_PARITY_GATE=1 ITERATION_SCHEDULER=1 CUDA_MAX_BATCH=8 nohup apr serve run {{params.gguf_model}} --gpu --host 0.0.0.0 --port 8081 > /tmp/apr-gguf-gpu.log 2>&1 & sleep 15; curl -sf http://127.0.0.1:8081/health >/dev/null"
    completion_check: "curl -sf http://127.0.0.1:8081/health >/dev/null 2>&1"
    depends_on: [lock-clocks]

policy:
  failure: stop_on_first
  lock_file: true

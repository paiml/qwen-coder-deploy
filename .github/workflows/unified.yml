name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML configs
        run: |
          for f in forjar*.yaml docs/roadmaps/*.yaml docs/specifications/*.yaml prompts/*.yaml; do
            [ -f "$f" ] && python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "  OK: $f" || echo "  SKIP: $f"
          done

      - name: Validate JSON results
        run: |
          total=0; valid=0; invalid=0
          for f in results/*.json; do
            [ -f "$f" ] || continue
            total=$((total+1))
            if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              valid=$((valid+1))
            else
              echo "  WARN: $f (invalid JSON)"
              invalid=$((invalid+1))
            fi
          done
          echo "$valid/$total valid, $invalid warnings"

      - name: Check spec version
        run: grep -q '^**Version:**' docs/specifications/gpu-performance-spec.md && echo "Spec version found"

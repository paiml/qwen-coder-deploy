version: "1.0"
name: qwen-coder-deploy-yoga-teardown
description: "Stop all Qwen inference services on yoga, unlock GPU clocks"

machines:
  yoga:
    hostname: yoga
    addr: 192.168.50.38
    user: noah
    arch: x86_64
    transport: ssh

resources:
  stop-apr:
    type: task
    machine: yoga
    command: "pkill -f 'apr serve' 2>/dev/null || true; pkill -f 'realizar serve' 2>/dev/null || true; sleep 2; pkill -9 -f 'apr serve' 2>/dev/null || true; pkill -9 -f 'realizar serve' 2>/dev/null || true; sleep 1; true"
    completion_check: "! pgrep -f 'apr serve' >/dev/null 2>&1 && ! pgrep -f 'realizar serve' >/dev/null 2>&1"

  stop-ollama:
    type: task
    machine: yoga
    command: "pkill -f 'ollama serve' 2>/dev/null || true; sudo systemctl stop ollama.service 2>/dev/null || true"
    completion_check: "! pgrep -f 'ollama serve' >/dev/null 2>&1"

  stop-llamacpp:
    type: task
    machine: yoga
    command: "pkill -f 'llama-server' 2>/dev/null || true"
    completion_check: "! pgrep -f 'llama-server' >/dev/null 2>&1"

  stop-vllm:
    type: task
    machine: yoga
    command: "pkill -f 'vllm' 2>/dev/null || true; pkill -f 'VLLM' 2>/dev/null || true; sleep 2; pkill -9 -f 'vllm' 2>/dev/null || true; pkill -9 -f 'VLLM' 2>/dev/null || true; sleep 1; true"
    completion_check: "! pgrep -f 'vllm' >/dev/null 2>&1 && ! pgrep -f 'VLLM' >/dev/null 2>&1"

  unlock-clocks:
    type: task
    machine: yoga
    command: "sudo nvidia-smi -rgc 2>/dev/null || true"
    completion_check: "true"
    depends_on: [stop-apr, stop-ollama, stop-llamacpp, stop-vllm]

policy:
  failure: continue_independent

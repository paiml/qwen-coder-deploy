version: "1.0"
name: qwen-coder-deploy-yoga-vllm
description: "Isolated vLLM benchmark on yoga (RTX 4060 Laptop)"

params:
  vllm_model: "Qwen/Qwen2.5-Coder-1.5B-Instruct-AWQ"

machines:
  yoga:
    hostname: yoga
    addr: 192.168.50.38
    user: noah
    arch: x86_64
    transport: ssh

resources:
  stop-ollama:
    type: task
    machine: yoga
    command: "pkill -f 'ollama serve' 2>/dev/null || true; sudo systemctl stop ollama.service 2>/dev/null || true"
    completion_check: "! pgrep -f 'ollama serve' >/dev/null 2>&1"

  stop-llamacpp:
    type: task
    machine: yoga
    command: "pkill -f 'llama-server' 2>/dev/null || true"
    completion_check: "! pgrep -f 'llama-server' >/dev/null 2>&1"

  stop-apr:
    type: task
    machine: yoga
    command: "pkill -f 'apr serve' 2>/dev/null || true; sleep 2; pkill -9 -f 'apr serve' 2>/dev/null || true; sleep 1; true"
    completion_check: "! pgrep -f 'apr serve' >/dev/null 2>&1"

  stop-vllm:
    type: task
    machine: yoga
    command: "pkill -f 'vllm serve' 2>/dev/null || true; pkill -f 'vllm.entrypoints' 2>/dev/null || true; sleep 2; true"
    completion_check: "! pgrep -f 'vllm' >/dev/null 2>&1"

  ufw-bench-ports:
    type: task
    machine: yoga
    command: "sudo ufw status | grep -q '8081:8084' || sudo ufw allow from 192.168.50.0/24 to any port 8081:8084 proto tcp"
    completion_check: "sudo ufw status | grep -q '8081:8084'"

  install-python3-dev:
    type: task
    machine: yoga
    command: "dpkg -s python3-dev >/dev/null 2>&1 || sudo apt install -y python3-dev"
    completion_check: "dpkg -s python3-dev >/dev/null 2>&1"

  install-uv:
    type: task
    machine: yoga
    command: "which uv >/dev/null 2>&1 || (curl -LsSf -o /tmp/uv-install.sh https://astral.sh/uv/install.sh && chmod +x /tmp/uv-install.sh && /tmp/uv-install.sh && rm /tmp/uv-install.sh)"
    completion_check: "which uv >/dev/null 2>&1 || test -f ~/.local/bin/uv"

  install-vllm:
    type: task
    machine: yoga
    command: "test -f ~/venvs/vllm/bin/vllm || (~/.local/bin/uv venv --clear ~/venvs/vllm && VIRTUAL_ENV=~/venvs/vllm ~/.local/bin/uv pip install vllm)"
    completion_check: "test -f ~/venvs/vllm/bin/vllm"
    depends_on: [install-uv, install-python3-dev]
    timeout: 600

  lock-clocks:
    type: task
    machine: yoga
    command: "sudo nvidia-smi -lgc 1900,1900 2>/dev/null || true"
    completion_check: "nvidia-smi --query-gpu=clocks.current.graphics --format=csv,noheader 2>/dev/null | grep -q '[0-9]'"
    depends_on: [stop-ollama, stop-llamacpp, stop-apr, stop-vllm, ufw-bench-ports, install-vllm]

  vllm-gpu:
    type: task
    machine: yoga
    command: "source ~/venvs/vllm/bin/activate && nohup vllm serve {{params.vllm_model}} --host 0.0.0.0 --port 8084 --max-model-len 4096 --gpu-memory-utilization 0.90 --dtype auto > /tmp/vllm-gpu.log 2>&1 & sleep 45; curl -sf http://127.0.0.1:8084/v1/models >/dev/null"
    completion_check: "curl -sf http://127.0.0.1:8084/v1/models >/dev/null 2>&1"
    depends_on: [lock-clocks]
    timeout: 120

policy:
  failure: stop_on_first
  lock_file: true
